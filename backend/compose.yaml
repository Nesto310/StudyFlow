services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studyflow}
      POSTGRES_USER: ${POSTGRES_USER:-studyflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studyflow}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - studyflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-studyflow} -d $${POSTGRES_DB:-studyflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  studyflow_postgres_data:
